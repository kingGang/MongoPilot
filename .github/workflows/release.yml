name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS (universal)
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            name: Linux (x86_64)
            rust-targets: ''
            args: ''
          - platform: windows-latest
            name: Windows (x86_64)
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        id: build
        uses: tauri-apps/tauri-action@v0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MongoPilot ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 打包器 (NSIS / WiX) 是构建时现下载的, GitHub 偶发 5xx 会让整个 release
      # 少掉一个平台的安装包 (v0.1.41 的 Windows 包就是这么丢的)。
      # Rust 编译产物已被 cache 命中, 重试基本只重跑打包, 代价很小。
      - name: Build Tauri bundle (retry)
        id: build_retry
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MongoPilot ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: ${{ github.event.head_commit.message }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Fail if both attempts failed
        if: steps.build.outcome == 'failure' && steps.build_retry.outcome != 'success'
        run: |
          echo "tauri build failed twice - see logs above"
          exit 1
